<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0420" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Motion Pong — Paddle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="/css/phone.css" />
</head>
<body>
  <header>
    <div class="title">MOTION<span>PONG</span></div>
    <div class="meta">
      <span class="room">ROOM <b id="room">····</b></span>
      <span id="chip" class="chip">READY</span>
    </div>
  </header>

  <main>
    <div id="orb-wrap">
      <div id="orb"><div id="orb-core"></div></div>
      <div id="countdown"></div>
    </div>
    <div id="status-text"></div>
    <div id="error" class="error" hidden></div>

    <div id="room-entry" hidden>
      <label for="room-input">Room code (shown on the laptop)</label>
      <input id="room-input" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD" />
    </div>

    <div class="buttons">
      <button id="start-btn" class="btn primary">START</button>
      <button id="cal-btn" class="btn" hidden>CALIBRATE</button>
    </div>

    <p class="hint">Hold like a paddle: <b>screen toward you</b>, back toward the laptop, <b>top edge up</b>. Strap on, grip tight.</p>
    <p id="mode" class="mode"></p>
  </main>

  <script type="module" src="/js/phone.js"></script>
</body>
</html>
